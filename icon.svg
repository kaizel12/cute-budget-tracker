<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b9f"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#be123c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" />
  
  <!-- Cute Piggy / Coin illustration -->
  <g filter="url(#shadow)">
    <!-- Piggy Ears -->
    <path d="M 160 170 Q 130 110 185 130 Z" fill="#ffb3c6" />
    <path d="M 352 170 Q 382 110 327 130 Z" fill="#ffb3c6" />
    
    <!-- Piggy Body -->
    <ellipse cx="256" cy="270" rx="140" ry="120" fill="#ffffff" />
    
    <!-- Eyes -->
    <circle cx="205" cy="245" r="12" fill="#1e293b" />
    <circle cx="202" cy="242" r="4" fill="#ffffff" />
    <circle cx="307" cy="245" r="12" fill="#1e293b" />
    <circle cx="304" cy="242" r="4" fill="#ffffff" />
    
    <!-- Cheeks Blush -->
    <ellipse cx="180" cy="275" rx="18" ry="10" fill="#fecdd3" />
    <ellipse cx="332" cy="275" rx="18" ry="10" fill="#fecdd3" />
    
    <!-- Snout -->
    <rect x="220" y="260" width="72" height="50" rx="25" fill="#f472b6" />
    <circle cx="242" cy="285" r="7" fill="#ffffff" />
    <circle cx="270" cy="285" r="7" fill="#ffffff" />
    
    <!-- Golden Coin on top -->
    <circle cx="256" cy="130" r="44" fill="#fbbf24" stroke="#f59e0b" stroke-width="6" />
    <text x="256" y="145" font-family="Quicksand, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">Rp</text>
    
    <!-- Blossom Flower -->
    <text x="360" y="190" font-size="48">🌸</text>
  </g>
</svg>
